repos:
  - repo: local
    hooks:
      - id: focused-compile
        name: focused compile checks
        entry: uv run python -m compileall -q src/todo_cli/webapp/app.py src/todo_cli/webapp/auth.py src/todo_cli/cli/export.py src/todo_cli/cli/notifications.py src/todo_cli/cli/recurring.py
        language: system
        pass_filenames: false
        always_run: true

      - id: focused-mypy
        name: focused mypy checks
        entry: uv run mypy src/todo_cli/cli/export.py src/todo_cli/cli/notifications.py src/todo_cli/cli/recurring.py src/todo_cli/services/operation_history.py
        language: system
        pass_filenames: false
        always_run: true

      - id: api-smoke
        name: web api smoke tests
        entry: uv run python -m pytest tests/test_api.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: cli-smoke
        name: cli compatibility smoke tests
        entry: uv run python -m pytest tests/test_cli_help.py tests/test_cli_command_compatibility.py -q
        language: system
        pass_filenames: false
        always_run: true
